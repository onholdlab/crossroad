<style id="inapp-lock">
/* Threads / IG / FB 內建瀏覽器:鎖住整頁,手勢全部交給遊戲 */
html,body{height:100%;overflow:hidden!important;overscroll-behavior:none}
body{position:fixed;inset:0}
/* 文件比畫面高 2px 並捲到 1px:App 會認為網頁不在最頂端,往下拖就不會把整個瀏覽器面板拉走
   (左右邊緣滑動把面板拖走是 Threads 自己的「右滑關閉」手勢,網頁還沒載入時也會發生,網頁擋不了,不用在這裡處理) */
html{height:calc(100% + 2px)!important}
</style>
<script id="inapp-lock-js">
(function(){
  var SKIP='button,input,textarea,select,a,label,[contenteditable]';
  function scrollable(el){
    for(;el&&el.nodeType===1&&el!==document.body;el=el.parentElement){
      var y=getComputedStyle(el).overflowY;
      if((y==='auto'||y==='scroll')&&el.scrollHeight>el.clientHeight)return true;
    }
    return false;
  }
  document.addEventListener('touchstart',function(e){
    var t=e.target;if(t.nodeType!==1)t=t.parentElement;
    if(t&&!t.closest(SKIP)&&!scrollable(t))e.preventDefault();
  },{passive:false});
  document.addEventListener('touchmove',function(e){
    var t=e.target;if(t.nodeType!==1)t=t.parentElement;
    if(!scrollable(t))e.preventDefault();
  },{passive:false});
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  /* inapp-keep1 */
  function keep(){if(window.scrollY<1)window.scrollTo(0,1);}
  keep();addEventListener('load',keep);addEventListener('resize',keep);addEventListener('scroll',keep,{passive:true});
  document.addEventListener('touchstart',keep,{passive:true,capture:true});
})();
</script>
